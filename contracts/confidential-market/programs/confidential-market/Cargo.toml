[package]
name = "confidential-market"
version = "0.1.0"
description = "Confidential prediction market for dum.fun using Encrypt FHE"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "confidential_market"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = "0.30.1"
# Encrypt FHE SDK (pre-alpha) — enables #[encrypt_fn] DSL for on-chain FHE computations
encrypt-anchor = { git = "https://github.com/dwallet-labs/encrypt-pre-alpha", optional = true }
encrypt-types  = { git = "https://github.com/dwallet-labs/encrypt-pre-alpha", optional = true }
encrypt-dsl    = { package = "encrypt-solana-dsl", git = "https://github.com/dwallet-labs/encrypt-pre-alpha", optional = true }

[features]
fhe = ["encrypt-anchor", "encrypt-types", "encrypt-dsl"]
