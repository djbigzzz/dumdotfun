[advisories]
version = 2
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]

ignore = [
    # atty@0.2.14 — RUSTSEC-2021-0145, RUSTSEC-2024-0375, GHSA-g98v-hv3f-hcfr
    # Transitive dep via anchor-lang / clap@2. Affects Windows fd handling only; not
    # exploitable in the SBF (BPF) on-chain execution environment or in CI on Linux.
    # atty is abandoned; fix requires replacing clap 2 with clap 4 inside anchor, which
    # is a breaking change outside this codebase's control.
    { id = "RUSTSEC-2021-0145", reason = "atty: Windows-only, non-exploitable in SBF runtime; locked by anchor-lang 0.30.x dep chain" },
    { id = "RUSTSEC-2024-0375", reason = "atty: Windows-only, non-exploitable in SBF runtime; locked by anchor-lang 0.30.x dep chain" },
    { id = "GHSA-g98v-hv3f-hcfr", reason = "atty: Windows-only, non-exploitable in SBF runtime; locked by anchor-lang 0.30.x dep chain" },

    # borsh@0.9.3 / borsh@0.10.4 — RUSTSEC-2023-0033, GHSA-fjx5-qpf4-xjf2
    # Float deserialization panic. Fix is borsh 1.x (API-incompatible).
    # Locked by anchor-lang 0.30.x which requires borsh 0.9/0.10 for legacy IDL.
    # Devnet-only contracts; no untrusted borsh deserialization from external sources.
    { id = "RUSTSEC-2023-0033", reason = "borsh 0.9/0.10: float panic, devnet-only; fix requires borsh 1.x which breaks anchor-lang 0.30.x" },
    { id = "GHSA-fjx5-qpf4-xjf2", reason = "borsh 0.9/0.10: float panic, devnet-only; fix requires borsh 1.x which breaks anchor-lang 0.30.x" },

    # ed25519-dalek@1.0.1 — RUSTSEC-2022-0093, GHSA-w5vr-6qhr-36cc
    # Timing side-channel in batch verification. Fix requires ed25519-dalek 2.x (API-incompatible).
    # Locked by solana-program / anchor-lang 0.30.x. Solana Labs has not yet migrated.
    { id = "RUSTSEC-2022-0093", reason = "ed25519-dalek 1.x: timing side-channel; fix requires 2.x which breaks anchor/solana-program 0.30.x" },
    { id = "GHSA-w5vr-6qhr-36cc", reason = "ed25519-dalek 1.x: timing side-channel; fix requires 2.x which breaks anchor/solana-program 0.30.x" },

    # curve25519-dalek@3.2.1 — RUSTSEC-2024-0344, GHSA-x4gp-pqpj-f43q
    # Timing side-channel in scalar multiplication. Fix requires curve25519-dalek 4.x (API-incompatible).
    # Locked by ed25519-dalek 1.x which pins to dalek 3.x.
    { id = "RUSTSEC-2024-0344", reason = "curve25519-dalek 3.x: timing side-channel; fix requires 4.x which breaks ed25519-dalek 1.x chain" },
    { id = "GHSA-x4gp-pqpj-f43q", reason = "curve25519-dalek 3.x: timing side-channel; fix requires 4.x which breaks ed25519-dalek 1.x chain" },

    # derivative@2.2.0 — RUSTSEC-2024-0388
    # Proc-macro soundness issue. No upstream fix released for 2.x.
    # Transitive dep from anchor-lang attribute macros.
    { id = "RUSTSEC-2024-0388", reason = "derivative: proc-macro soundness; no 2.x fix released, locked by anchor-lang macro deps" },

    # paste@1.0.15 — RUSTSEC-2024-0436
    # Token-injection soundness issue. Transitive dep from anchor-lang / solana-program macros.
    { id = "RUSTSEC-2024-0436", reason = "paste: token-injection soundness; transitive from anchor-lang macro deps, no fix in same major" },

    # bincode@1.3.3 — RUSTSEC-2025-0141
    # DoS via malformed input. Fix requires bincode 2.x (API-incompatible).
    # Locked by anchor-lang 0.30.x serialization.
    { id = "RUSTSEC-2025-0141", reason = "bincode 1.x: DoS via malformed input; fix requires 2.x which breaks anchor-lang 0.30.x" },

    # libsecp256k1@0.6.0 — RUSTSEC-2025-0161
    # Transitive dep from solana-sdk. No compatible fix in 0.6.x.
    { id = "RUSTSEC-2025-0161", reason = "libsecp256k1 0.6: no compatible fix in 0.6.x, locked by solana-sdk transitive dep" },

    # rand@0.7.3 — GHSA-cq8v-f236-94qc, RUSTSEC-2026-0097
    # Locked by ed25519-dalek 1.x and other solana/anchor transitive deps at 0.7.x.
    # Fix requires rand 0.9+ which is API-incompatible.
    { id = "GHSA-cq8v-f236-94qc", reason = "rand 0.7.x: locked by anchor/solana transitive deps; fix requires rand 0.9+ (API-incompatible)" },
    { id = "RUSTSEC-2026-0097", reason = "rand 0.7.x: locked by anchor/solana transitive deps; fix requires rand 0.9+ (API-incompatible)" },
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "ISC",
    "Unicode-DFS-2016",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "0BSD",
]
